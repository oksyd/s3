name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: cargo fmt --check

  feature-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: cargo check --lib --no-default-features
      - run: cargo test --lib --no-default-features
      - run: cargo test --lib --no-default-features --features providers

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: blocking-rustls
            args: "--no-default-features --features blocking,rustls"
          - name: async-all
            args: >-
              --no-default-features
              --features async,rustls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: blocking-all
            args: >-
              --no-default-features
              --features blocking,rustls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: async-all-native-tls
            args: >-
              --no-default-features
              --features async,native-tls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: blocking-all-native-tls
            args: >-
              --no-default-features
              --features blocking,native-tls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install OpenSSL (native-tls)
        if: contains(matrix.name, 'native-tls')
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: blocking-rustls
            args: "--no-default-features --features blocking,rustls"
          - name: async-all
            args: >-
              --no-default-features
              --features async,rustls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: blocking-all
            args: >-
              --no-default-features
              --features blocking,rustls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: async-all-native-tls
            args: >-
              --no-default-features
              --features async,native-tls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
          - name: blocking-all-native-tls
            args: >-
              --no-default-features
              --features blocking,native-tls,multipart,checksums,credentials-profile,credentials-imds,credentials-sts,tracing,metrics
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install OpenSSL (native-tls)
        if: contains(matrix.name, 'native-tls')
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test ${{ matrix.args }}

  minio-integration:
    runs-on: ubuntu-latest
    env:
      S3_TEST_BACKEND: minio
      S3_TEST_STRICT: "1"
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_IMAGE: quay.io/minio/minio:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install OpenSSL (native-tls)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Start MinIO
        run: |
          set -euxo pipefail
          docker rm -f minio || true
          docker pull "$MINIO_IMAGE"
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_DOMAIN=localhost \
            "$MINIO_IMAGE" server /data --console-address ":9001"
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          docker ps -a --filter name=minio >&2 || true
          docker logs minio >&2 || true
          exit 1
      - name: Async integration
        run: cargo test --test s3_compat_async --features multipart
      - name: Async integration (native-tls)
        run: cargo test --test s3_compat_async --no-default-features --features async,native-tls,multipart
      - name: Blocking integration
        run: cargo test --test s3_compat_blocking --no-default-features --features blocking,rustls,multipart
      - name: Blocking integration (native-tls)
        run: cargo test --test s3_compat_blocking --no-default-features --features blocking,native-tls,multipart
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  rustfs-integration:
    runs-on: ubuntu-latest
    env:
      S3_TEST_BACKEND: rustfs
      S3_TEST_STRICT: "0"
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_REGION: us-east-1
      AWS_ACCESS_KEY_ID: s3rsrustfsadmin
      AWS_SECRET_ACCESS_KEY: s3rsrustfsadminsecret
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install OpenSSL (native-tls)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -v rustfs-data:/data \
            -e RUSTFS_ADDRESS=:9000 \
            -e RUSTFS_ACCESS_KEY=s3rsrustfsadmin \
            -e RUSTFS_SECRET_KEY=s3rsrustfsadminsecret \
            -e RUSTFS_SERVER_DOMAINS=localhost \
            rustfs/rustfs:latest \
            /data
      - name: Wait for RustFS
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not become ready in time" >&2
          docker ps -a --filter name=rustfs >&2 || true
          docker logs rustfs >&2 || true
          exit 1
      - name: Async integration
        run: cargo test --test s3_compat_async --features multipart
      - name: Async integration (native-tls)
        run: cargo test --test s3_compat_async --no-default-features --features async,native-tls,multipart
      - name: Blocking integration
        run: cargo test --test s3_compat_blocking --no-default-features --features blocking,rustls,multipart
      - name: Blocking integration (native-tls)
        run: cargo test --test s3_compat_blocking --no-default-features --features blocking,native-tls,multipart
      - name: Stop RustFS
        if: always()
        run: |
          docker rm -f rustfs || true
          docker volume rm rustfs-data || true
